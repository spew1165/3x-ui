name: Upstream Sync

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_SYNC_REPO: MHSanaei/3x-ui
  UPSTREAM_SYNC_BRANCH: main
  TARGET_SYNC_BRANCH: sync

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      # Step 1: run a standard checkout action
      - name: Checkout target repo
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ env.TARGET_SYNC_BRANCH }}
          fetch-depth: 0

      # Step 2: run the sync action
      - name: Add upstream remote
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM_SYNC_REPO }}.git" || git remote set-url upstream "https://github.com/${{ env.UPSTREAM_SYNC_REPO }}.git"

      - name: Fetch upstream latest code
        run: |
          git fetch upstream --tags --force
          echo "=== 上游分支 ==="
          git branch -r

      - name: Check current branch status
        run: |
          echo "=== 当前分支信息 ==="
          git branch -vv
          echo ""
          echo "=== 本地 ${{ env.TARGET_SYNC_BRANCH }} 最新提交 ==="
          git log -3 --oneline
          echo ""
          echo "=== 上游/${{ env.UPSTREAM_SYNC_BRANCH }} 最新提交 ==="
          git log -3 upstream/${{ env.UPSTREAM_SYNC_BRANCH }} --oneline

      - name: Sync upstream changes and push (skip workflow files to avoid permission error)
        run: |
          # Save current workflow files
          mkdir -p /tmp/save-workflows
          cp -r .github/workflows/* /tmp/save-workflows/ 2>/dev/null || true

          # Reset to upstream
          git checkout ${{ env.TARGET_SYNC_BRANCH }}
          git reset --hard upstream/${{ env.UPSTREAM_SYNC_BRANCH }}
          echo "=== 重置完成 ==="

          # Restore fork-specific workflow files (avoid GITHUB_TOKEN restriction on pushing workflow file changes)
          cp -r /tmp/save-workflows/* .github/workflows/ 2>/dev/null || true
          git add -A
          git commit -m "chore: restore fork-specific workflow files" || echo "没有 workflow 变更，无需恢复"

          # Push — no workflow file diff, so GITHUB_TOKEN is sufficient
          git push --force origin ${{ env.TARGET_SYNC_BRANCH }}
          echo "=== 推送完成 ==="

      - name: Verify sync completion
        run: |
          UPSTREAM_COMMIT=$(git rev-parse upstream/${{ env.UPSTREAM_SYNC_BRANCH }})
          echo "当前 HEAD: $(git rev-parse HEAD)"
          echo "上游提交: $UPSTREAM_COMMIT"
          echo "=== 验证同步内容（排除 workflow 文件）==="
          # Check that all non-workflow files match upstream
          if git diff --quiet upstream/${{ env.UPSTREAM_SYNC_BRANCH }} HEAD -- ':!.github/workflows'; then
            echo "✓ 非 workflow 文件已与上游同步"
          else
            echo "✗ 非 workflow 文件与上游存在差异"
            git diff --stat upstream/${{ env.UPSTREAM_SYNC_BRANCH }} HEAD -- ':!.github/workflows'
            exit 1
          fi

      - name: Sync check
        if: failure()
        run: |
          echo "[错误] 同步失败，请检查以下可能的原因："
          echo "1. 上游仓库不存在或网络不可达"
          echo "2. 分支保护规则阻止了强制推送"
          echo "3. workflow 文件以外的代码文件存在冲突"
          echo "请手动检查上游仓库状态，或查看 Action 日志获取更多细节。"
          exit 1

      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 1
